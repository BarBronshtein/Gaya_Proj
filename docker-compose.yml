services:
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: gaya-mssql
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=StrongPassword123!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'StrongPassword123!' -C -Q 'SELECT 1' 2>/dev/null || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'StrongPassword123!' -Q 'SELECT 1' 2>/dev/null || bash -c '</dev/tcp/127.0.0.1/1433' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  openobserve:
    image: openobserve/openobserve:latest
    container_name: gaya-openobserve
    restart: unless-stopped
    environment:
      - ZO_ROOT_USER_EMAIL=root@example.com
      - ZO_ROOT_USER_PASSWORD=ComplexPass#123
      - ZO_DATA_DIR=/data
    ports:
      - "5080:5080"
    volumes:
      - openobserve_data:/data

  api:
    build:
      context: .
      dockerfile: src/Gaya.Api/Dockerfile
    container_name: gaya-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=OperationsDb;User Id=sa;Password=StrongPassword123!;TrustServerCertificate=True;Encrypt=True;MultipleActiveResultSets=true;
      - OpenTelemetry__OtlpEndpoint=http://openobserve:5080/api/default
      - OpenTelemetry__Headers=Authorization=Basic cm9vdEBleGFtcGxlLmNvbTpDb21wbGV4UGFzcyMxMjM=
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
    ports:
      - "5000:5000"
    depends_on:
      sqlserver:
        condition: service_healthy
      openobserve:
        condition: service_started

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: gaya-client
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  mssql_data:
    driver: local
  openobserve_data:
    driver: local
