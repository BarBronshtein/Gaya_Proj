name: CD & Release Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production
      publish_containers:
        description: 'Publish Docker images to GHCR'
        required: true
        default: true
        type: boolean
      create_github_release:
        description: 'Create GitHub Release (if tag or dispatch)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write
  deployments: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ================================================================
  # Job 1: Build and Publish Production Docker Images to GHCR
  # ================================================================
  publish-containers:
    name: Build & Publish Container Images (GHCR)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || inputs.publish_containers == true }}

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata for Gaya.Api
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push Backend API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/Gaya.Api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Docker Metadata for Gaya Client UI
        id: meta-client
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/client
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push Frontend Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ================================================================
  # Job 2: Package Release Assets & Create GitHub Release
  # ================================================================
  package-and-release:
    name: Package Release Assets & Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [ publish-containers ]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.create_github_release == true

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Build & Publish Backend API
        run: dotnet publish src/Gaya.Api/Gaya.Api.csproj -c Release -o ./dist-release/api /p:UseAppHost=false

      - name: Build Production Frontend Client
        run: |
          cd client
          npm ci
          npm run build -- --configuration production
          mkdir -p ../dist-release/client
          cp -r dist/client/browser/* ../dist-release/client/

      - name: Package Release Archives
        run: |
          mkdir -p release-packages
          cp docker-compose.yml ./dist-release/
          cp README.md ./dist-release/
          
          # Create tar.gz package
          tar -czvf release-packages/gaya-operations-platform-${{ github.ref_name }}.tar.gz -C dist-release .
          
          # Create zip package
          cd dist-release && zip -r ../release-packages/gaya-operations-platform-${{ github.ref_name }}.zip . && cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-packages/gaya-operations-platform-*.tar.gz
            release-packages/gaya-operations-platform-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ================================================================
  # Job 3: Automated Deployment Gate & Verification
  # ================================================================
  deploy:
    name: Deploy to Environment
    runs-on: ubuntu-latest
    needs: [ publish-containers ]
    environment:
      name: ${{ inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Deployment Execution Notification
        run: |
          TARGET_ENV="${{ inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}"
          echo "🚀 Deploying Gaya Operations Platform to environment: $TARGET_ENV"
          echo "Image API: ghcr.io/${{ github.repository }}/api:latest"
          echo "Image Client: ghcr.io/${{ github.repository }}/client:latest"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Deployment metadata initialized."
